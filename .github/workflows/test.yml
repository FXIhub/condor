# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: test

on:
  push:
    branches: [ master, electron_density ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        mpi: ['mpi4py', 'none']
        python-version: [ '3.11']
        cuda: [with_cuda, without_cuda]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install base dependencies
      shell: bash -l {0}
      run: |
        sudo apt-get update
        pip install h5py scipy
    - name: Install mpi
      shell: bash -l {0}
      run: |
        sudo apt-get install -y libopenmpi-dev openmpi-bin
        pip install mpi4py
      if: matrix.mpi != 'none'
    - name: Install NVIDIA CUDA Toolkit (if required)
      if: matrix.cuda == 'with_cuda'
      run: |
        sudo apt-get install -y nvidia-cuda-toolkit      
    - name: Install libspimage
      run: |
        pip install numpy
        sudo apt-get install libtiff-dev libpng-dev libhdf5-dev libgsl-dev libfftw3-dev swig libnfft3-dev
        git clone https://github.com/FXIhub/libspimage.git
        cd libspimage
        mkdir build
        cd build
        cmake ..
        make
        sudo make install
    - name: Install spsim
      run: |
        git clone https://github.com/FilipeMaia/spsim.git
        cd spsim
        mkdir build
        cd build
        cmake ..
        make
        sudo make install                
    - name: Lint with flake8
      shell: bash -l {0}
      run: |
        pip install flake8
    - name: Install package
      shell: bash -l {0}
      run: |
        pip install numpy scipy h5py
        pip install --no-build-isolation -e .
    - name: Test with pytest
      shell: bash -l {0}
      run: |
        pip install pytest codecov pytest-cov
        cd tests
        pytest --cov=./ --cov-report=xml
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}